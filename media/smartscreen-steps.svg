<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">The two presses past the Windows warning</title>
  <desc id="d">Left: the blue "Windows protected your PC" box, with the small "More info" link marked 1. Right: the same box after the press, showing the app name and a "Run anyway" button marked 2.</desc>
  <g>
    <rect x="10" y="20" width="400" height="290" rx="6" fill="#0a63b8"/>
    <text x="34" y="70" fill="#fff" font-size="24" font-weight="600">Windows protected your PC</text>
    <text x="34" y="108" fill="#e6f0fb" font-size="14">Microsoft Defender SmartScreen prevented an</text>
    <text x="34" y="128" fill="#e6f0fb" font-size="14">unrecognized app from starting. Running this</text>
    <text x="34" y="148" fill="#e6f0fb" font-size="14">app might put your PC at risk.</text>
    <text x="34" y="180" fill="#fff" font-size="14" text-decoration="underline">More info</text>
    <rect x="26" y="162" width="82" height="26" rx="4" fill="none" stroke="#ffd23f" stroke-width="3"/>
    <circle cx="124" cy="175" r="13" fill="#ffd23f"/><text x="124" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0b2540">1</text>
    <rect x="290" y="262" width="100" height="32" fill="#e8e8e8"/><text x="340" y="283" text-anchor="middle" font-size="14" fill="#222">Don't run</text>
  </g>
  <path d="M424 165 h28 m-10 -10 l10 10 l-10 10" stroke="currentColor" stroke-width="3" fill="none" opacity=".6"/>
  <g>
    <rect x="470" y="20" width="400" height="290" rx="6" fill="#0a63b8"/>
    <text x="494" y="70" fill="#fff" font-size="24" font-weight="600">Windows protected your PC</text>
    <text x="494" y="108" fill="#e6f0fb" font-size="14">Microsoft Defender SmartScreen prevented an</text>
    <text x="494" y="128" fill="#e6f0fb" font-size="14">unrecognized app from starting.</text>
    <text x="494" y="166" fill="#fff" font-size="14">App: Modryos-Install-0.2.0.exe</text>
    <text x="494" y="188" fill="#fff" font-size="14">Publisher: Unknown publisher</text>
    <rect x="636" y="262" width="110" height="32" fill="#e8e8e8"/><text x="691" y="283" text-anchor="middle" font-size="14" fill="#222">Run anyway</text>
    <rect x="630" y="256" width="122" height="44" rx="4" fill="none" stroke="#ffd23f" stroke-width="3"/>
    <circle cx="616" cy="278" r="13" fill="#ffd23f"/><text x="616" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#0b2540">2</text>
    <rect x="756" y="262" width="100" height="32" fill="#e8e8e8"/><text x="806" y="283" text-anchor="middle" font-size="14" fill="#222">Don't run</text>
  </g>
</svg>
